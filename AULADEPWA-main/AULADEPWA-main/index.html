    <style>

        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;

        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-width: 100vh;
            background: linear-gradient(135deg, #fcdff8, #e09bd1, #d64bb8) ;
            background-position: center;
            background-size: contain;
            opacity: 80%;
        }
        button{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ff7cc4;
            height: 100px;
            width: 400px;
            border-radius: 40px;
            border: solid 2px rgba(0, 0, 0, 0.344);
            font-size: 20px;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            cursor: pointer;
             transition: 0.3s;
            box-shadow: rgba(0, 0, 0, 0.45) 0px 5px 15px;;
        }

        button:hover {
        background-color: #760055;
        }

        a{
            text-decoration: none;
        }
      

    </style>
